# Офлайн-тести при кожній зміні коду
name: tests

on:
  push:
    branches-ignore: [state]
  pull_request: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: fc-list | grep -qi dejavusans || (sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core)
      - run: python -m pytest -q
