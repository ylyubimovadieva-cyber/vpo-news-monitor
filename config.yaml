# ---------------------------------------------------------------------------
# Збір
# ---------------------------------------------------------------------------
collector:
  max_age_hours: 72            # новини, старші за це, не публікуються
  request_delay_seconds: 3     # пауза між запитами до одного сайту
  max_items_per_source: 30
  fetch_article_text: true     # завантажувати повний текст новини
  timeout_seconds: 20
  user_agent: "vpo-news-monitor/1.0 (non-commercial news monitoring)"

# Порівняння новин (дублікати і пошук «тієї самої події» в різних медіа)
dedupe:
  cluster_threshold: 0.25      # схожість (0–1), з якої новини вважаються кандидатами на одну подію
  duplicate_threshold: 0.85    # майже ідентичні заголовки

# ---------------------------------------------------------------------------
# Модель Claude
# ---------------------------------------------------------------------------
llm:
  model: "claude-sonnet-5-5"
  effort: "medium"
  max_tokens: 8000
  min_confidence: 0.7          # нижче – у щоденний звіт «сумнівні»
  server_fallbacks: true       # якщо модель відмовить, API повторить запит на рекомендованій резервній моделі
  max_attempts_per_cluster: 3

# ---------------------------------------------------------------------------
# Правила тексту допису
# ---------------------------------------------------------------------------
text_rules:
  min_length: 400
  max_length: 700
  source_prefix: "Джерело: "
  # Оцінні слова: дозволені, лише якщо є в тексті першоджерела
  evaluative_words: ["нарешті", "ганебн", "шокуюч", "сенсаційн", "неймовірн", "жахлив", "скандальн", "довгоочікуван", "безпрецедентн", "катастрофічн"]
  # Канцеляризми: не блокують, але показуються координаторці як попередження
  bureaucratese: ["здійснюва", "з метою", "у разі", "даний ", "вищезазначен", "на сьогоднішній день", "в рамках", "у рамках", "проведено роботу", "являється", "являє собою"]

# ---------------------------------------------------------------------------
# Погодження і публікація
# ---------------------------------------------------------------------------
approval:
  expire_hours: 48

telegram:
  # chat_id приватного чату координаторки (число). Можна перекрити змінною
  # TELEGRAM_COORDINATOR_CHAT_ID. Як дізнатися – див. README.
  coordinator_chat_id: 0
  # Група «Національна платформа» (@idpcongressua)
  group_username: "@idpcongressua"
  group_chat_id: 0             # заповнити після scripts/get_topic_ids.py (від'ємне число на кшталт -100...)
  topics:                      # message_thread_id тем групи
    DIM: 0
    HOLOS: 0
    TURBOTA: 0
    POVERNENNIA: 0
    PAMIAT: 0
    MOZHLYVOSTI: 0               # тему «МОЖЛИВОСТІ» треба створити в групі
  # Теми тестової групи (необов'язково). Якщо 0 – у тестову групу без теми.
  test_topics:
    DIM: 0
    HOLOS: 0
    TURBOTA: 0
    POVERNENNIA: 0
    PAMIAT: 0
    MOZHLYVOSTI: 0               # тему «МОЖЛИВОСТІ» треба створити в групі
  daily_limit_per_topic: 3

facebook:
  enabled: true                # false – кнопка Facebook зникає, на Facebook нічого не йде
  page_name: "Конгрес ВПО України"
  page_id: ""                  # ID сторінки (не секрет); токен – у FACEBOOK_PAGE_TOKEN
  graph_api_version: "v23.0"
  daily_limit: 2

