# Конфігурація сервісу моніторингу новин «Конгрес ВПО України».
# Тут НЕМАЄ і не має бути секретів (токенів, ключів). Секрети – лише у змінних
# оточення або GitHub Secrets (див. README).

# ---------------------------------------------------------------------------
# П'ять стовпів. Назви (title) публікуються в першому рядку допису дослівно.
# Ключі (DIM, HOLOS, ...) – службові, їх не змінюйте.
# keywords – регулярні вирази без урахування регістру; використовуються як
# підказка для класифікації і в офлайн-тестах.
# ---------------------------------------------------------------------------
pillars:
  DIM:
    title: "ДІМ – право на стабільність"
    topic_name: "ДІМ"
    about: "житло, компенсації за зруйноване житло, соціальне і доступне житло, житлові програми, місця тимчасового проживання"
    keywords: ["житл", "компенсац\\w* за (зруйнован|пошкоджен)", "єВідновленн", "зруйнован\\w* (житл|будин|квартир)", "соціальн\\w* житл", "доступн\\w* житл", "оренд\\w* житл", "місц\\w* тимчасового проживання", "модульн", "гуртожит", "житлов\\w* сертифікат", "shelter", "housing"]
  HOLOS:
    title: "ГОЛОС – право на участь"
    topic_name: "ГОЛОС"
    about: "участь ВПО в ухваленні рішень, ради ВПО, консультації з громадськістю, виборчі права, представництво"
    keywords: ["рад\\w* (з питань )?(ВПО|внутрішньо переміщених)", "консультац\\w* з громадськ", "громадськ\\w* обговоренн", "громадськ\\w* рад", "виборч", "голосуванн", "представництв", "участ\\w* (ВПО|переселенців) в ухваленн", "залученн\\w* (ВПО|переселенців)", "participation"]
  TURBOTA:
    title: "ТУРБОТА – право на турботу"
    topic_name: "ТУРБОТА"
    about: "соціальний захист, виплати ВПО, оцінювання потреб, медична і психологічна допомога, послуги для вразливих груп"
    keywords: ["виплат", "допомог\\w* на проживання", "соціальн\\w* захист", "оцінюванн\\w* потреб", "медичн", "психолог", "реабілітац", "соціальн\\w* послуг", "вразлив", "інвалідніст", "пенсі", "Пенсійн\\w* фонд", "грошов\\w* допомог", "cash assistance", "protection"]
  POVERNENNIA:
    title: "ПОВЕРНЕННЯ – право на приналежність"
    topic_name: "ПОВЕРНЕННЯ"
    about: "повернення, реінтеграція, деокуповані території, інтеграція в приймаючих громадах, документи, зайнятість"
    keywords: ["поверненн", "повертаю?т", "реінтеграц", "деокупован", "звільнен\\w* (територ|громад)", "інтеграц", "приймаюч\\w* громад", "\\bдокумент(?!уванн)", "паспорт", "працевлаштуванн", "зайнятіст", "робоч\\w* місц", "returnee", "integration"]
  PAMIAT:
    title: "ПАМ'ЯТЬ – право на правду"
    topic_name: "ПАМ'ЯТЬ"
    about: "документування злочинів і втрат, реєстр збитків, правосуддя, увічнення пам'яті, архіви свідчень"
    keywords: ["документуванн", "воєнн\\w* злочин", "реєстр\\w* збитк", "Register of Damage", "компенсаційн\\w* комісі", "правосудд", "трибунал", "Міжнародн\\w* кримінальн", "увічненн", "пам['’]ят", "архів", "свідчен", "депортац"]
  # Рубрика (не стовп): гранти, конкурси, програми і можливості для ВПО.
  # Має власну тему в групі. Допис обов'язково містить дедлайн; без дедлайну
  # або після нього не публікується.
  MOZHLYVOSTI:
    title: "МОЖЛИВОСТІ – гранти і програми для ВПО"
    topic_name: "МОЖЛИВОСТІ"
    about: "гранти, конкурси, стипендії, навчальні програми, програми працевлаштування і підтримки для ВПО та організацій, що з ними працюють; лише з чітким дедлайном"
    keywords: ["грант", "конкурс\\w* (проєкт|грант|заяв|для)", "стипенді", "прийом заявок", "приймаю\\w* заявки", "подати заявку", "дедлайн", "навчальн\\w* програм", "call for (proposals|applications)", "funding opportunit", "\\bgrants?\\b"]

# ---------------------------------------------------------------------------
# Попередній відбір: новина йде на аналіз моделлю, лише якщо в заголовку або
# тексті є хоча б один із цих виразів (ВПО або люди, постраждалі від війни).
# ---------------------------------------------------------------------------
relevance_keywords:
  - "ВПО"
  - "внутрішньо переміщ"
  - "переселен"
  - "вимушено переміщ"
  - "евакуйован"
  - "евакуац"
  - "постраждал\\w* (від|внаслідок) (війни|збройної агресії|бойових дій|обстрілів)"
  - "зруйнован\\w* (житл|будин|квартир)"
  - "пошкоджен\\w* (житл|будин|квартир)"
  - "єВідновленн"
  - "деокупован"
  - "окупован\\w* територ"
  - "Реєстр\\w* збитк"
  - "біженц"
  - "\\bIDPs?\\b"
  - "internally displaced"
  - "displace"
  - "returnee"
  - "Register of Damage"
  # гранти і можливості
  - "грант\\w* для (ВПО|переселенц|громад|організац|ГО|жінок|молоді|ветеран)"
  - "можливост\\w* для (ВПО|переселенц)"
  - "конкурс\\w* (проєкт|грант|міні-грант)"
  - "call for (proposals|applications)"

# ---------------------------------------------------------------------------
# Білий список. Новина з домену з primary_domains – першоджерело.
# Новина з домену з media – медіа; для підтвердження потрібні два медіа
# різних власників (owner). Субдомени враховуються автоматично
# (наприклад, "gov.ua" охоплює kmu.gov.ua, сайти ОВА тощо).
# Новини з доменів поза білим списком не приймаються взагалі.
# ---------------------------------------------------------------------------
whitelist:
  primary_domains:
    # органи влади (усі сайти в зоні gov.ua: Кабмін, Рада, міністерства, ПФУ,
    # Омбудсман, обласні військові адміністрації)
    - gov.ua
    - zakon.rada.gov.ua
    # міжнародні організації
    - unhcr.org
    - iom.int
    - reliefweb.int
    - unocha.org
    - undp.org
    - unesco.org
    - coe.int
    - irex.org
    - acted.org
    - globalprotectioncluster.org
    - sheltercluster.org
    - drc.ngo
    - nrc.no
    # партнери та організації платформи (список доповнюватиметься)
    - irf.ua
    - rokada.org.ua
    - r2p.org.ua
    - krymsos.com
    - dostupoint.org.ua
    - ldn.org.ua
    - csdf.org.ua
    - east-sos.org
    - helsinki.org.ua
    # грантодавці (власні конкурси) – для рубрики МОЖЛИВОСТІ
    - ednannia.ua
    - houseofeurope.org.ua
    - ucf.in.ua
  media:
    - {domain: ukrinform.ua, owner: ukrinform}
    - {domain: suspilne.media, owner: suspilne}
    - {domain: radiosvoboda.org, owner: rferl}
    - {domain: pravda.com.ua, owner: up}
    - {domain: eurointegration.com.ua, owner: up}
    - {domain: epravda.com.ua, owner: up}
    - {domain: hromadske.ua, owner: hromadske}
    - {domain: lb.ua, owner: lb}
    - {domain: slovoidilo.ua, owner: slovoidilo}

# Заборонені домени: відкидаються ще до перевірки, навіть якщо випадково
# потрапили в білий список. Сюди ж – агрегатори і Telegram.
blocked_domains:
  - ru
  - su
  - рф
  - by
  - t.me
  - telegram.me
  - telegram.org
  - news.google.com
  - ukr.net
  - meta.ua
  - msn.com
  - yahoo.com

# Telegram заблоковано як джерело (анонімні канали заборонені). Виняток –
# лише ОФІЦІЙНІ ІМЕННІ канали посадовців і установ з цього списку.
# Додавайте канал, лише переконавшись, що на нього посилається офіційний сайт
# або офіційна сторінка власника. kind: primary – допис каналу є першоджерелом.
telegram_channels:
  - {channel: dmytro_lubinetzs, name: "Дмитро Лубінець, Уповноважений ВРУ з прав людини", owner: ombudsman, kind: primary}
  - {channel: frolovproparliament, name: "Павло Фролов, голова ТСК з питань захисту прав ВПО", owner: frolov, kind: primary}

# Якщо в тексті новини є такі посилання на джерела, новина відкидається
# (передрук російських матеріалів, анонімні канали).
blocked_attribution_patterns:
  - "ТАСС"
  - "ТАРС"
  - "РИА Новости"
  - "РІА Новини"
  - "Russia Today"
  - "росЗМІ"
  - "російськ\\w* (ЗМІ|пропагандистськ|медіа)"
  - "анонімн\\w* (телеграм|Telegram)"

# ---------------------------------------------------------------------------
# Джерела для збору. Новини з них приймаються, лише якщо домен посилання є
# в білому списку вище.
#   type: rss  – стрічка RSS/Atom (url)
#   type: html – сторінка зі списком новин (url) + link_regex для посилань
#                на окремі новини; кожна новина завантажується окремо
#   type: facebook – офіційна сторінка Facebook (page: ім'я або ID сторінки).
#                Працює лише з токеном FACEBOOK_READ_TOKEN (див. README).
#                kind: primary – допис сторінки вважається першоджерелом.
#   type: telegram – офіційний іменний канал (channel: ім'я каналу); канал
#                має бути в списку telegram_channels вище.
# require_keywords – брати із загальної стрічки лише записи з цими словами
# enabled: false – тимчасово вимкнути джерело
# ---------------------------------------------------------------------------
